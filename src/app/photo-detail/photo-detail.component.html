<section class="detail-page">
  <a class="back-link" routerLink="/favorites"><mat-icon>arrow_back</mat-icon> Back to your collection</a>
  @if (photo(); as image) {
    <div class="photo-view">
      <img [src]="image.url" [alt]="image.alt">
      <div class="photo-caption">
        <span class="eyebrow">A MOMENT WORTH KEEPING</span>
        <h1>Photo no. {{ image.id }}</h1>
        <button mat-flat-button (click)="remove(image.id)"><mat-icon>favorite</mat-icon>Remove from favorites</button>
      </div>
    </div>
  } @else {
    <div class="missing-photo">
      <h1>This photo isn’t in your collection.</h1>
      <a mat-button routerLink="/favorites">Return to favorites</a>
    </div>
  }
</section>
